<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sfondo Blu Notte arrotondato -->
  <rect width="100" height="100" rx="20" fill="#081A24"/>
  
  <!-- === COLTELLO === -->
  <!-- Lama (Grigio Argento) -->
  <path d="
    M 24 15
    C 24 8, 33 10, 33 25
    C 33 38, 31 45, 31 48
    L 31 50
    L 24 50
    Z" 
    fill="#9FB6BE" 
  />
  
  <!-- Manico (Turchese) -->
  <path d="
    M 28 50
    C 28 58, 31 68, 31 80
    C 31 88, 21 88, 21 80
    C 21 68, 24 58, 24 50
    Z" 
    fill="#24C6C8" 
  />

  <!-- === TRIDENTE === -->
  <!-- Asta centrale -->
  <line x1="70" y1="87" x2="70" y2="17" stroke="#E8B85C" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Grip tridente (Manico Poseidone) -->
  <rect x="66" y="55" width="8" height="20" rx="2" fill="#087EA4" />
  <rect x="64" y="53" width="12" height="3" rx="1.5" fill="#24C6C8" />
  <rect x="64" y="75" width="12" height="3" rx="1.5" fill="#24C6C8" />

  <!-- Base a U delle punte esterne -->
  <path d="M 55 24 L 55 38 C 55 52, 85 52, 85 38 L 85 24" fill="none" stroke="#E8B85C" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Punte (Arpioni) -->
  <!-- Sinistra -->
  <polygon points="55,13 47,24 55,20 63,24" fill="#E8B85C" />
  <!-- Destra -->
  <polygon points="85,13 77,24 85,20 93,24" fill="#E8B85C" />
  <!-- Centrale (più alta e grande) -->
  <polygon points="70,5 59,18 70,13 81,18" fill="#E8B85C" />
</svg>
